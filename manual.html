<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lean3（リーン3）取扱説明書</title>
    <link rel="stylesheet" href="manual-styles.css" />
  </head>
  <body class="viewer-body">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">Lean3</div>
          <div>
            <p class="brand-title">取扱説明書</p>
            <p class="brand-subtitle">操作マニュアル</p>
          </div>
        </div>
        <div class="tree-toolbar">
          <div class="search-input-wrap">
            <input id="tree-search" type="search" placeholder="検索キーワードを入力" />
            <button id="tree-search-clear" class="search-clear-button" type="button" aria-label="Clear search" hidden>&times;</button>
          </div>
          <div class="search-mode-toggle" role="group" aria-label="Search mode">
            <button id="search-mode-tree" class="search-mode-button search-mode-button-active" type="button">ツリー表示</button>
            <button id="search-mode-fulltext" class="search-mode-button" type="button">全文検索</button>
          </div>
        </div>
        <nav id="tree-root" class="tree-root" aria-label="Document tree"></nav>
        <div id="search-results" class="search-results" hidden></div>
      </aside>
      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" hidden aria-hidden="true" tabindex="-1"></button>
      <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize panes"></div>
      <main class="content-pane">
        <div class="content-bar">
          <button
            id="mobile-tree-toggle"
            class="mobile-tree-toggle"
            type="button"
            aria-label="Open navigation"
            aria-controls="tree-root"
            aria-expanded="false"
          >
            メニュー
          </button>
          <div class="content-meta">
            <nav class="breadcrumb" aria-label="breadcrumb">
              <span class="breadcrumb-home">⌂</span>
              <span class="breadcrumb-root">Lean3 取扱説明書</span>
              <span class="breadcrumb-sep">›</span>
              <span id="current-title" class="content-title">目次</span>
            </nav>
          </div>
          <div class="content-actions">
            <button id="open-topic" class="action-button" type="button">別タブで開く</button>
            <button id="print-topic" class="action-button" type="button">印刷用に開く</button>
            <button id="download-pdf" class="action-button action-button-primary" type="button">PDFダウンロード</button>
          </div>
        </div>
        <iframe id="topic-frame" class="topic-frame" title="Topic content"></iframe>
      </main>
    </div>
    <div id="image-modal" class="image-modal" hidden aria-hidden="true">
      <button id="image-modal-close" class="image-modal-close" type="button" aria-label="Close image">&#215;</button>
      <img id="image-modal-preview" class="image-modal-preview" alt="" />
      <div id="image-modal-svg-host" class="image-modal-svg-host" hidden></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="data/manual-data.js"></script>
    <script src="manual-app.js"></script>
  </body>
</html>
