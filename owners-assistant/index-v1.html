<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サインイン (V1 MVP) - Lean3 OWNER'S ASSISTANT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .logo p {
      color: #666;
      font-size: 14px;
    }

    .version-badge {
      display: inline-block;
      background: #10b981;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .divider {
      text-align: center;
      margin: 25px 0;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: #e0e0e0;
    }

    .divider span {
      background: white;
      padding: 0 15px;
      color: #999;
      font-size: 14px;
      position: relative;
      z-index: 1;
    }

    .demo-note {
      background: #f0fdf4;
      border-left: 4px solid #10b981;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .demo-note h4 {
      color: #059669;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .demo-note p {
      color: #166534;
      font-size: 13px;
      line-height: 1.6;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #10b981;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s;
    }

    .back-link a:hover {
      color: #059669;
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>Lean3</h1>
      <p>OWNER'S ASSISTANT</p>
      <span class="version-badge">V1 MVP - 9月末納品</span>
    </div>

    <div class="welcome">
      <h2>ようこそ</h2>
      <p>仮ログイン認証でサインインしてください</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn">サインイン</button>
    </form>

    <div class="divider">
      <span>または</span>
    </div>

    <button class="btn" onclick="demoLogin()">
      デモモードで開く
    </button>

    <div class="demo-note">
      <h4>🎯 V1 MVP版について</h4>
      <p>
        この画面は9月末納車に必須のマスト要件のみを実装したV1版です。<br>
        ステータス機能やOTA通知など、Phase 2の機能は含まれません。<br>
        <strong>車両はLean3 2026年式に自動設定されます。</strong>
      </p>
    </div>

    <div class="back-link">
      <a href="version-select.html">← バージョン選択に戻る</a>
    </div>

    <div class="footer">
      © 2026 Lean Mobility. All rights reserved.
    </div>
  </div>

  <script src="onboarding-status.js"></script>
  <script>
    // V1であることを記録
    localStorage.setItem('selectedVersion', 'v1');

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (email && password) {
        // ユーザー情報を保存（モック）
        localStorage.setItem('lean3User', JSON.stringify({
          email: email,
          loginTime: new Date().toISOString(),
          version: 'v1'
        }));
        
        // V1: 車両情報を自動設定（Lean3 2026固定）
        localStorage.setItem('selectedVehicle', JSON.stringify({
          model: 'lean3',
          year: '2026',
          version: 'v1'
        }));
        
        // V1用のアプリへ直接遷移（車両選択スキップ）
        window.location.href = 'app-v1.html';
      }
    });

    function demoLogin() {
      localStorage.setItem('lean3User', JSON.stringify({
        email: 'demo@lean3.com',
        demoMode: true,
        loginTime: new Date().toISOString(),
        version: 'v1'
      }));
      
      // V1: 車両情報を自動設定（Lean3 2026固定）
      localStorage.setItem('selectedVehicle', JSON.stringify({
        model: 'lean3',
        year: '2026',
        version: 'v1'
      }));
      
      // V1用のアプリへ直接遷移（車両選択スキップ）
      window.location.href = 'app-v1.html';
    }

    // 既にログイン済みの場合はV1アプリへリダイレクト
    window.addEventListener('DOMContentLoaded', function() {
      const user = localStorage.getItem('lean3User');
      if (user) {
        const userData = JSON.parse(user);
        if (userData.version === 'v1') {
          // V1でログイン済みならV1アプリへ
          window.location.href = 'app-v1.html';
        }
      }
    });
  </script>
</body>
</html>
