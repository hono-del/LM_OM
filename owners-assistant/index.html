<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWNER'S ASSISTANT - Lean3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .logo p {
      color: #666;
      font-size: 14px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #6b7280;
      box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.1);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(107, 114, 128, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .divider {
      text-align: center;
      margin: 25px 0;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: #e0e0e0;
    }

    .divider span {
      background: white;
      padding: 0 15px;
      color: #999;
      font-size: 14px;
      position: relative;
      z-index: 1;
    }

    .demo-note {
      background: #f3f4f6;
      border-left: 4px solid #6b7280;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .demo-note h4 {
      color: #4b5563;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .demo-note p {
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    .demo-note code {
      background: white;
      padding: 2px 6px;
      border-radius: 4px;
      color: #6b7280;
      font-family: monospace;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>Lean3</h1>
      <p>OWNER'S ASSISTANT</p>
    </div>

    <div class="welcome">
      <h2>ようこそ</h2>
      <p>Lean3オーナーアシスタントにサインインしてください</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn">サインイン</button>
    </form>

    <div class="divider">
      <span>または</span>
    </div>

    <button class="btn" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);" onclick="demoLogin()">
      デモモードで開く
    </button>

    <div class="demo-note">
      <h4>🎯 デモモード</h4>
      <p>
        デモモードでは、実際の認証なしでアプリの機能を体験できます。<br>
        または、任意のメールアドレスとパスワードでサインインしてください。
      </p>
    </div>

    <div class="footer">
      © 2026 Lean Mobility. All rights reserved.
    </div>
  </div>

  <script src="onboarding-status.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (email && password) {
        // ユーザー情報を保存（モック）
        localStorage.setItem('lean3User', JSON.stringify({
          email: email,
          loginTime: new Date().toISOString()
        }));
        
        // ログイン成功後：オンボーディング状態に応じて遷移
        OnboardingStatus.navigateAfterLogin();
      }
    });

    function demoLogin() {
      localStorage.setItem('lean3User', JSON.stringify({
        email: 'demo@lean3.com',
        demoMode: true,
        loginTime: new Date().toISOString()
      }));
      
      // ログイン成功後：オンボーディング状態に応じて遷移
      OnboardingStatus.navigateAfterLogin();
    }

    // 既にログイン済みの場合は適切な画面へリダイレクト
    window.addEventListener('DOMContentLoaded', function() {
      OnboardingStatus.guardPage('login');
    });
  </script>
</body>
</html>
